name: Build Net Doctor APK

on:
  push:
    branches: [main]
    paths:
      - 'net-doctor/**'
      - '.github/workflows/build-net-doctor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        working-directory: net-doctor
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp net-doctor/app/build/outputs/apk/debug/app-debug.apk artifact/NetDoctor-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetDoctor-APK
          path: artifact/NetDoctor-debug.apk
          if-no-files-found: error
          retention-days: 14
